services:
  api:
    build: .
    env_file:
      - .env
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/finance
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      SM_KEK: ${SM_KEK:-change-this-key-encryption-key}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
      - ./app-release:/app/app-release
      - ./test-releases:/app/test-releases
    restart: always

  admin:
    build:
      context: ../admin
      args:
        NEXT_PUBLIC_API_URL: /api
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
    mem_limit: 384m
    restart: always

  db:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: finance
    volumes:
      - pgdata:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=50
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  pgdata:
  uploads:
